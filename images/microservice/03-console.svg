<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .h{font-size:21px;font-weight:700;fill:#0F172A}
      .sub{font-size:12px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.5}
      .tt{font-size:13px;font-weight:600;fill:#0F172A}
      .mono{font-family:Consolas,'Liberation Mono',monospace;font-size:12px;fill:#E2E8F0}
      .green{font-family:Consolas,'Liberation Mono',monospace;font-size:12px;fill:#86EFAC}
      .amber{font-family:Consolas,'Liberation Mono',monospace;font-size:12px;fill:#FCD34D}
      .dim{font-family:Consolas,'Liberation Mono',monospace;font-size:12px;fill:#94A3B8}
      .why{font-size:12px;font-weight:700;fill:#4F46E5}
      .whyd{font-size:11px;fill:#475569}
      .ui{font-size:11px;fill:#334155}
    </style>
  </defs>
  <rect width="960" height="470" fill="#F8FAFC"/>
  <text x="32" y="40" class="h">容器日志里能看到什么</text>
  <text x="32" y="62" class="sub">起服务、下单、重放三个时刻的输出，用来确认每一环真的发生了</text>
  <text x="928" y="40" text-anchor="end" class="sub">效果示意 · 非实拍</text>

  <rect x="32" y="86" width="580" height="300" rx="10" fill="#0F172A"/>
  <rect x="32" y="86" width="580" height="30" rx="10" fill="#1E293B"/>
  <circle cx="52" cy="101" r="5" fill="#F87171"/>
  <circle cx="70" cy="101" r="5" fill="#FBBF24"/>
  <circle cx="88" cy="101" r="5" fill="#4ADE80"/>
  <text x="320" y="105" text-anchor="middle" class="dim">容器日志 · docker compose logs</text>

  <text x="48" y="140" class="green">$ docker compose logs order-api</text>
  <text x="48" y="162" class="mono">info: 已注册 order-service-a1b2c3-8080，</text>
  <text x="48" y="180" class="mono">      心跳地址 http://order-api:8080/health</text>
  <text x="48" y="198" class="dim">info: Now listening on: http://0.0.0.0:8080</text>
  <text x="48" y="226" class="green">$ docker compose logs product-api</text>
  <text x="48" y="248" class="mono">info: 已注册 product-service-d4e5f6-8080</text>
  <text x="48" y="276" class="amber">info: 事件 3f8c2a...：产品 1 扣减 1，剩余库存 99</text>
  <text x="48" y="304" class="dim">info: 事件 3f8c2a... 已处理过，跳过</text>
  <text x="48" y="332" class="dim">info: 事件 3f8c2a... 已处理过，跳过</text>
  <text x="48" y="362" class="green">→ 重放 3 次，库存只扣了 1 次</text>

  <rect x="628" y="86" width="300" height="300" rx="10" class="card"/>
  <text x="644" y="112" class="tt">同一时刻的 Consul UI</text>
  <rect x="644" y="128" width="268" height="88" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="656" y="148" class="ui">Services</text>
  <circle cx="662" cy="172" r="5" fill="#16A34A"/>
  <text x="676" y="176" class="ui">order-service</text>
  <text x="900" y="176" text-anchor="end" class="ui">1 passing</text>
  <circle cx="662" cy="196" r="5" fill="#16A34A"/>
  <text x="676" y="200" class="ui">product-service</text>
  <text x="900" y="200" text-anchor="end" class="ui">1 passing</text>

  <rect x="644" y="228" width="268" height="74" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="656" y="248" class="ui">Node Checks</text>
  <text x="656" y="272" class="ui">Service check: /health</text>
  <text x="900" y="272" text-anchor="end" fill="#16A34A" class="ui">passing</text>
  <text x="656" y="290" class="ui">每 5s 一次 · 超时 3s</text>

  <rect x="644" y="314" width="268" height="56" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="656" y="336" class="ui">日志里的心跳地址</text>
  <text x="656" y="356" class="ui">用来核对注册时地址是否写对</text>

  <rect x="32" y="400" width="896" height="58" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="48" y="424" class="why">为什么特意加这几行日志</text>
  <text x="48" y="446" class="whyd">注册成功没有界面反馈，心跳地址写错也只有等请求失败才发现；把这两件事打到日志里，用 docker compose logs 一查就能核对。消费端那两行让「扣减」与「判重跳过」肉眼可分，验证幂等不必先连数据库。</text>
</svg>
