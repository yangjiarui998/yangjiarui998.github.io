<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      .h{font-size:21px;font-weight:700;fill:#0F172A}
      .sub{font-size:12px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1.5}
      .name{font-size:14px;font-weight:600;fill:#0F172A}
      .desc{font-size:11px;fill:#64748B}
      .mono{font-family:Consolas,'Liberation Mono',monospace;font-size:11px;fill:#334155}
      .step{font-size:11px;font-weight:700;fill:#4F46E5}
      .why{font-size:12px;font-weight:600;fill:#4F46E5}
      .whyd{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="960" height="520" fill="#F8FAFC"/>
  <text x="32" y="40" class="h">一个完整例子的链路</text>
  <text x="32" y="62" class="sub">下单 → 写订单 → 本地事务发事件 → RabbitMQ → 产品服务扣库存（全部在 Docker 里）</text>
  <text x="928" y="40" text-anchor="end" class="sub">效果示意 · 非实拍</text>

  <g>
    <rect x="32" y="90" width="180" height="76" rx="10" class="card"/>
    <text x="46" y="112" class="step">① 客户端</text>
    <text x="46" y="134" class="mono">POST /orders</text>
    <text x="46" y="152" class="desc">买 1 个 iPhone</text>

    <rect x="242" y="90" width="180" height="76" rx="10" class="card"/>
    <text x="256" y="112" class="step">② Ocelot 网关</text>
    <text x="256" y="134" class="mono">:8080</text>
    <text x="256" y="152" class="desc">按服务名找实例</text>

    <rect x="452" y="90" width="180" height="76" rx="10" class="card"/>
    <text x="466" y="112" class="step">③ Order.Api</text>
    <text x="466" y="134" class="mono">order-api:8080</text>
    <text x="466" y="152" class="desc">写订单 + 发事件</text>

    <rect x="662" y="90" width="266" height="76" rx="10" class="card"/>
    <text x="676" y="112" class="step">④ 订单库（同一个事务）</text>
    <text x="676" y="134" class="mono">Orders + cap.published</text>
    <text x="676" y="152" class="desc">订单行与消息一起提交</text>

    <rect x="662" y="250" width="266" height="76" rx="10" class="card"/>
    <text x="676" y="272" class="step">⑤ RabbitMQ</text>
    <text x="676" y="294" class="mono">cap.default.router</text>
    <text x="676" y="312" class="desc">队列 product-api.v1</text>

    <rect x="452" y="250" width="180" height="76" rx="10" class="card"/>
    <text x="466" y="272" class="step">⑥ Product.Api</text>
    <text x="466" y="294" class="mono">product-api:8080</text>
    <text x="466" y="312" class="desc">判重后扣库存</text>

    <rect x="242" y="250" width="180" height="76" rx="10" class="card"/>
    <text x="256" y="272" class="step">⑦ 产品库</text>
    <text x="256" y="294" class="mono">Stock: 100 → 99</text>
    <text x="256" y="312" class="desc">同时记下 EventId</text>

    <rect x="32" y="250" width="180" height="76" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="46" y="272" class="step">⑧ 看到的结果</text>
    <text x="46" y="294" class="mono">HTTP 200</text>
    <text x="46" y="312" class="desc">库存少 1，不重复</text>
  </g>

  <g stroke="#94A3B8" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M 212 128 L 236 128"/>
    <path d="M 422 128 L 446 128"/>
    <path d="M 632 128 L 656 128"/>
    <path d="M 795 166 L 795 244"/>
    <path d="M 662 288 L 638 288"/>
    <path d="M 452 288 L 428 288"/>
    <path d="M 242 288 L 218 288"/>
  </g>

  <g>
    <rect x="32" y="366" width="212" height="118" rx="10" class="card"/>
    <text x="46" y="390" class="why">为什么有网关</text>
    <text x="46" y="412" class="whyd">客户端只认一个入口，</text>
    <text x="46" y="430" class="whyd">服务地址不写死在调用方；</text>
    <text x="46" y="448" class="whyd">限流、缓存、熔断集中一处。</text>
    <text x="46" y="470" class="desc">代价：多一跳、多一个要维护的容器</text>

    <rect x="256" y="366" width="212" height="118" rx="10" class="card"/>
    <text x="270" y="390" class="why">为什么发事件</text>
    <text x="270" y="412" class="whyd">订单服务不直接调用产品服务，</text>
    <text x="270" y="430" class="whyd">产品服务挂了也能先收单。</text>
    <text x="270" y="448" class="whyd">换成强一致就得上分布式事务。</text>
    <text x="270" y="470" class="desc">代价：库存是稍后才更新的</text>

    <rect x="480" y="366" width="212" height="118" rx="10" class="card"/>
    <text x="494" y="390" class="why">为什么要 Outbox</text>
    <text x="494" y="412" class="whyd">先写库再发消息，中间崩溃</text>
    <text x="494" y="430" class="whyd">就会「有订单没消息」。</text>
    <text x="494" y="448" class="whyd">消息表与订单同事务才不丢。</text>
    <text x="494" y="470" class="desc">代价：业务库多两张 CAP 表</text>

    <rect x="704" y="366" width="224" height="118" rx="10" class="card"/>
    <text x="718" y="390" class="why">为什么要幂等</text>
    <text x="718" y="412" class="whyd">至少一次投递必然有重复，</text>
    <text x="718" y="430" class="whyd">重放一次就多扣一次库存。</text>
    <text x="718" y="448" class="whyd">唯一键 + 本地事务挡住重复。</text>
    <text x="718" y="470" class="desc">代价：判重表要有清理策略</text>
  </g>
</svg>
